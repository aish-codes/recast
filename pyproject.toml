[project]
name = "recast"
version = "0.1.0"
description = "Tailor a master resume profile to a job description, deterministically and without hallucination."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "openai>=1.55",            # used as an OpenAI-compatible client; points at Groq by default
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "typer>=0.15",
    "rich>=13.9",
    "reportlab>=4.2",          # pure-Python PDF; no browser, no OS packages
    "pypdf>=5.1",              # read our own PDF back the way an ATS would
    "python-docx>=1.1",        # .docx output; some ATS parse Word more reliably
    "fastapi>=0.115",
    "python-multipart>=0.0.20",  # file uploads
    "pyjwt[crypto]>=2.10",     # verify Supabase access tokens without calling Supabase
    "certifi>=2024.8",         # CA bundle, so the JWKS fetch works off a bare macOS python

    "uvicorn[standard]>=0.32",
]

[project.scripts]
recast = "recast.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recast"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "PLE", "I", "UP"]
